version: "3.8"

services:
  ringingo-api-fs:
    container_name: ringingo-api-fs
    build: .

    restart: always

    # Host network: FreeSWITCH ESL only accepts 127.0.0.1, and the .env points
    # at other host services on 127.0.0.1. App listens on NEST_JS_SERVER_PORT (5000).
    network_mode: host

    env_file:
      - .env

    volumes:
      - /opt/caching:/opt/caching
      - /usr/local/freeswitch:/usr/local/freeswitch
